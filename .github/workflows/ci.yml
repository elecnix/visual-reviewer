name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: node dist/cli.js --help > /dev/null
      - run: node dist/cli.js clusters --help > /dev/null

  oracle-smoke:
    # End-to-end: one synthetic bundle through the real provider.
    # Skips gracefully if the key isn't configured.
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc
      - name: Judge one synthetic bundle through the routed endpoint
        # The secret is scoped to this step, so npm ci and tsc cannot read it.
        # The endpoint, the model and the credential are the three the Cite
        # reviewer already uses, so this smoke exercises the endpoint the fleet
        # bills against instead of a second account nobody else calls. The
        # judge's own defaults stay unchanged for users.
        env:
          VISUAL_REVIEWER_BASE_URL: ${{ vars.REVIEW_MODEL_BASE_URL }}
          VISUAL_REVIEWER_MODEL: ${{ vars.REVIEW_MODEL_ID }}
          VISUAL_REVIEWER_API_KEY_ENV: REVIEW_MODEL_API_KEY
          REVIEW_MODEL_API_KEY: ${{ secrets.REVIEW_MODEL_API_KEY }}
        run: node scripts/oracle-smoke.mjs
