name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: node dist/cli.js --help > /dev/null
      - run: node dist/cli.js clusters --help > /dev/null

  oracle-smoke:
    # End-to-end: one synthetic bundle through the real provider.
    # Skips gracefully if the key isn't configured.
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc
      - name: Judge one synthetic bundle with Ollama Cloud
        # The secret is scoped to this step, so npm ci and tsc cannot read it.
        # Ollama Cloud is selected through the VISUAL_REVIEWER_* overrides; the
        # default judge (OpenRouter) is unchanged for users.
        env:
          VISUAL_REVIEWER_BASE_URL: https://ollama.com/v1
          VISUAL_REVIEWER_MODEL: deepseek-v4.1-flash
          VISUAL_REVIEWER_API_KEY_ENV: OLLAMA_API_KEY
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: node scripts/oracle-smoke.mjs
