name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: node dist/cli.js --help > /dev/null
      - run: node dist/cli.js clusters --help > /dev/null

  oracle-smoke:
    # End-to-end: one synthetic bundle through the real provider.
    # Skips gracefully if the key isn't configured.
    runs-on: ubuntu-latest
    needs: build
    env:
      # Ollama Cloud, selected through the VISUAL_REVIEWER_* overrides; the
      # default judge (OpenRouter) is unchanged for users.
      VISUAL_REVIEWER_BASE_URL: https://ollama.com/v1
      VISUAL_REVIEWER_MODEL: deepseek-v4.1-flash
      VISUAL_REVIEWER_API_KEY_ENV: OLLAMA_API_KEY
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc
      - run: node scripts/oracle-smoke.mjs
